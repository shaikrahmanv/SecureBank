<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transaction History - SecureBank</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        .navbar {
            background: #0b1f3a;
            color: white;
            padding: 18px 40px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 45px auto;
            padding: 20px;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #6b7280;
        }

        .table-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th {
            background: #0b1f3a;
            color: white;
            text-align: left;
            padding: 15px;
            font-size: 14px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        tr:hover td {
            background: #f8fafc;
        }

        .amount {
            font-weight: bold;
        }

        .type {
            font-weight: bold;
        }

        .method {
            color: #4b5563;
        }

        .date {
            color: #6b7280;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #0b1f3a;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        @media (max-width: 750px) {

            .navbar {
                padding: 15px 20px;
            }

            .container {
                margin-top: 25px;
            }

            .table-card {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">SecureBank</div>
    </div>

    <div class="container">

        <div class="heading">
            <h1>Transaction History</h1>

            <p>
                View your recent banking transactions.
            </p>
        </div>

        <div class="table-card">

            <table>

                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Details</th>
                        <th>Method</th>
                        <th>Amount</th>
                        <th>Date</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="transaction : ${transactions}">

                        <td class="type"
                            th:text="${transaction.type}">
                        </td>

                        <td th:text="${transaction.details}">
                        </td>

                        <td class="method"
                            th:text="${transaction.method}">
                        </td>

                        <td class="amount">
                            ₹<span th:text="${transaction.amount}"></span>
                        </td>

                        <td class="date"
                            th:text="${transaction.date}">
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

        <a href="/login" class="back">
            ← Back to Login
        </a>

    </div>

</body>

</html>
