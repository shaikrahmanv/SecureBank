<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureBank | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #07111f;
            overflow: hidden;
            position: relative;
        }

        /* International currency background */
        .currencies {
            position: absolute;
            inset: 0;
            overflow: hidden;
            opacity: 0.12;
            color: white;
            pointer-events: none;
        }

        .currency {
            position: absolute;
            font-size: 70px;
            font-weight: bold;
            animation: float 12s infinite ease-in-out;
        }

        .c1  { left: 5%;  top: 10%; }
        .c2  { left: 20%; top: 75%; font-size: 55px; }
        .c3  { left: 35%; top: 8%;  font-size: 60px; }
        .c4  { left: 50%; top: 80%; }
        .c5  { left: 68%; top: 12%; font-size: 55px; }
        .c6  { left: 82%; top: 70%; }
        .c7  { left: 90%; top: 25%; font-size: 55px; }
        .c8  { left: 8%;  top: 55%; font-size: 50px; }
        .c9  { left: 43%; top: 45%; font-size: 50px; }
        .c10 { left: 75%; top: 48%; font-size: 65px; }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-25px) rotate(8deg);
            }
        }

        /* Dark overlay */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(
                circle at center,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.75)
            );
        }

        /* Login card */
        .login-container {
            position: relative;
            z-index: 2;
            width: 390px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.20);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }

        .logo {
            text-align: center;
            margin-bottom: 8px;
        }

        .logo h1 {
            color: white;
            font-size: 32px;
            letter-spacing: 1px;
        }

        .logo span {
            color: #8ec5ff;
        }

        .subtitle {
            text-align: center;
            color: #c8d3df;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .error {
            background: rgba(255, 70, 70, 0.15);
            border: 1px solid rgba(255, 90, 90, 0.4);
            color: #ffb3b3;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: white;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            outline: none;
            background: rgba(0, 0, 0, 0.25);
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-group input::placeholder {
            color: #aab5c1;
        }

        .input-group input:focus {
            border-color: #8ec5ff;
            box-shadow: 0 0 10px rgba(142, 197, 255, 0.25);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #2477d4;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            background: #3288e5;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            color: #c8d3df;
            font-size: 14px;
        }

        .register-link a {
            color: #8ec5ff;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .security {
            text-align: center;
            margin-top: 25px;
            color: #9eacba;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .login-container {
                width: 90%;
                padding: 30px;
            }

            .currency {
                font-size: 45px;
            }
        }
    </style>
</head>

<body>

    <!-- International currencies -->
    <div class="currencies">
        <div class="currency c1">₹</div>
        <div class="currency c2">$</div>
        <div class="currency c3">€</div>
        <div class="currency c4">£</div>
        <div class="currency c5">¥</div>
        <div class="currency c6">₩</div>
        <div class="currency c7">₽</div>
        <div class="currency c8">₺</div>
        <div class="currency c9">₫</div>
        <div class="currency c10">₦</div>
    </div>

    <!-- Login card -->
    <div class="login-container">

        <div class="logo">
            <h1>Secure<span>Bank</span></h1>
        </div>

        <p class="subtitle">
            Secure Digital Banking
        </p>

        <!-- Existing Spring Boot / Thymeleaf error handling -->
        <p class="error"
           th:if="${error != null}"
           th:text="${error}">
        </p>

        <!-- Existing login endpoint preserved -->
        <form action="/login" method="post">

            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>
            </div>

            <button type="submit" class="login-btn">
                Login Securely
            </button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="/register">Create an account</a>
        </div>

        <div class="security">
            🔒 Your banking information is protected
        </div>

    </div>

</body>
</html>
