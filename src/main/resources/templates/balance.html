<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account Balance - SecureBank</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        .navbar {
            background: #0b1f3a;
            color: white;
            padding: 18px 40px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 550px;
            margin: 70px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .holder {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .balance-box {
            background: #f4f7fb;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .balance-label {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .balance {
            font-size: 32px;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 10px;
            color: #0b1f3a;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">SecureBank</div>
    </div>

    <div class="container">

        <div class="card">

            <div class="icon">💰</div>

            <h1>Account Balance</h1>

            <p class="holder">
                Account Holder:
                <strong th:text="${user.name}"></strong>
            </p>

            <div class="balance-box">

                <div class="balance-label">
                    Available Balance
                </div>

                <div class="balance">
                    ₹<span th:text="${user.balance}"></span>
                </div>

            </div>

            <a href="/login" class="back">
                ← Back to Login
            </a>

        </div>

    </div>

</body>

</html>
