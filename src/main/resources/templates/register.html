<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SecureBank | Register</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #07111f;
            overflow-x: hidden;
            position: relative;
            padding: 30px 0;
        }

        .currencies {
            position: fixed;
            inset: 0;
            overflow: hidden;
            opacity: 0.12;
            color: white;
            pointer-events: none;
        }

        .currency {
            position: absolute;
            font-size: 70px;
            font-weight: bold;
            animation: float 12s infinite ease-in-out;
        }

        .c1 { left: 5%; top: 8%; }
        .c2 { left: 20%; top: 80%; font-size: 55px; }
        .c3 { left: 35%; top: 5%; font-size: 60px; }
        .c4 { left: 50%; top: 82%; }
        .c5 { left: 68%; top: 10%; font-size: 55px; }
        .c6 { left: 82%; top: 72%; }
        .c7 { left: 90%; top: 25%; font-size: 55px; }
        .c8 { left: 8%; top: 55%; font-size: 50px; }
        .c9 { left: 43%; top: 45%; font-size: 50px; }
        .c10 { left: 75%; top: 48%; font-size: 65px; }

        @keyframes float {

            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-25px) rotate(8deg);
            }
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(
                circle at center,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.78)
            );
            z-index: 1;
        }

        .register-container {
            position: relative;
            z-index: 2;
            width: 600px;
            padding: 38px 42px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.20);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }

        .logo {
            text-align: center;
            margin-bottom: 7px;
        }

        .logo h1 {
            color: white;
            font-size: 32px;
            letter-spacing: 1px;
        }

        .logo span {
            color: #8ec5ff;
        }

        .subtitle {
            text-align: center;
            color: #c8d3df;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .error-message {
            background: rgba(255, 70, 70, 0.15);
            border: 1px solid rgba(255, 90, 90, 0.4);
            color: #ffb3b3;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
        }

        .form-row {
            display: flex;
            gap: 18px;
        }

        .input-group {
            flex: 1;
            margin-bottom: 17px;
        }

        .input-group.full {
            width: 100%;
        }

        .input-group label {
            display: block;
            color: white;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .input-group input,
        .input-group select,
        .input-group textarea {

            width: 100%;
            padding: 12px 13px;

            border: 1px solid rgba(255, 255, 255, 0.25);

            border-radius: 10px;

            outline: none;

            background: rgba(0, 0, 0, 0.25);

            color: white;

            font-size: 14px;

            transition: 0.3s;
        }

        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {

            border-color: #8ec5ff;

            box-shadow:
                0 0 10px
                rgba(142, 197, 255, 0.25);
        }

        .input-group input::placeholder,
        .input-group textarea::placeholder {
            color: #aab5c1;
        }

        .input-group select option {
            color: black;
            background: white;
        }

        .input-group textarea {
            height: 75px;
            resize: vertical;
        }

        .password-error {
            display: none;
            color: #ffb3b3;
            font-size: 13px;
            margin-top: -8px;
            margin-bottom: 12px;
        }

        .register-btn {

            width: 100%;

            padding: 13px;

            margin-top: 5px;

            border: none;

            border-radius: 10px;

            background: #2477d4;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            background: #3288e5;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #c8d3df;
            font-size: 14px;
        }

        .login-link a {
            color: #8ec5ff;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .security {
            text-align: center;
            margin-top: 20px;
            color: #9eacba;
            font-size: 12px;
        }

        @media (max-width: 600px) {

            .register-container {
                width: 92%;
                padding: 30px 25px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .currency {
                font-size: 45px;
            }
        }

    </style>

</head>

<body>

    <div class="currencies">

        <div class="currency c1">₹</div>
        <div class="currency c2">$</div>
        <div class="currency c3">€</div>
        <div class="currency c4">£</div>
        <div class="currency c5">¥</div>
        <div class="currency c6">₩</div>
        <div class="currency c7">₽</div>
        <div class="currency c8">₺</div>
        <div class="currency c9">₫</div>
        <div class="currency c10">₦</div>

    </div>

    <div class="register-container">

        <div class="logo">
            <h1>
                Secure<span>Bank</span>
            </h1>
        </div>

        <p class="subtitle">
            Create Your Secure Banking Account
        </p>

        <p th:if="${error != null}"
           th:text="${error}"
           class="error-message">
        </p>

        <form action="/register"
              method="post">

            <div class="form-row">

                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input type="text"
                           id="name"
                           name="name"
                           placeholder="Enter your full name"
                           required>

                </div>

                <div class="input-group">

                    <label for="contactNumber">
                        Contact Number
                    </label>

                    <input type="tel"
                           id="contactNumber"
                           name="contactNumber"
                           placeholder="10-digit mobile number"
                           pattern="[0-9]{10}"
                           maxlength="10"
                           minlength="10"
                           required>

                </div>

            </div>

            <div class="form-row">

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="Enter your email"
                           required>

                </div>

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Create a password"
                           minlength="8"
                           required>

                </div>

            </div>

            <div class="form-row">

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input type="password"
                           id="confirmPassword"
                           name="confirmPassword"
                           placeholder="Re-enter your password"
                           minlength="8"
                           required>

                </div>

                <div class="input-group">

                    <label for="dateOfBirth">
                        Date of Birth
                    </label>

                    <input type="date"
                           id="dateOfBirth"
                           name="dateOfBirth"
                           required>

                </div>

            </div>

            <div class="input-group full">

                <label for="accountType">
                    Account Type
                </label>

                <select id="accountType"
                        name="accountType"
                        required>

                    <option value="">
                        Select Account Type
                    </option>

                    <option value="Savings">
                        Savings
                    </option>

                    <option value="Current">
                        Current
                    </option>

                </select>

            </div>

            <div class="input-group full">

                <label for="currency">
                    Account Currency
                </label>

                <select id="currency"
                        name="currency"
                        required>

                    <option value="INR">
                        India - INR (₹)
                    </option>

                    <option value="USD">
                        United States - USD ($)
                    </option>

                    <option value="EUR">
                        European Union - EUR (€)
                    </option>

                    <option value="GBP">
                        United Kingdom - GBP (£)
                    </option>

                    <option value="JPY">
                        Japan - JPY (¥)
                    </option>

                    <option value="CNY">
                        China - CNY (¥)
                    </option>

                    <option value="KRW">
                        South Korea - KRW (₩)
                    </option>

                    <option value="RUB">
                        Russia - RUB (₽)
                    </option>

                    <option value="TRY">
                        Turkey - TRY (₺)
                    </option>

                    <option value="VND">
                        Vietnam - VND (₫)
                    </option>

                    <option value="NGN">
                        Nigeria - NGN (₦)
                    </option>

                    <option value="AED">
                        UAE - AED
                    </option>

                    <option value="SAR">
                        Saudi Arabia - SAR
                    </option>

                    <option value="CAD">
                        Canada - CAD
                    </option>

                    <option value="AUD">
                        Australia - AUD
                    </option>

                    <option value="SGD">
                        Singapore - SGD
                    </option>

                    <option value="CHF">
                        Switzerland - CHF
                    </option>

                    <option value="BRL">
                        Brazil - BRL
                    </option>

                    <option value="ZAR">
                        South Africa - ZAR
                    </option>

                </select>

            </div>

            <div class="input-group full">

                <label for="address">
                    Address
                </label>

                <textarea id="address"
                          name="address"
                          placeholder="Enter your complete address"
                          required></textarea>

            </div>

            <div id="passwordError"
                 class="password-error">

                Passwords do not match.

            </div>

            <button type="submit"
                    class="register-btn">

                Create Secure Account

            </button>

        </form>

        <div class="login-link">

            Already have an account?

            <a href="/login">
                Login here
            </a>

        </div>

        <div class="security">

            🔒 Your personal information is protected

        </div>

    </div>

    <script>

        const registerForm =
            document.querySelector("form");

        const password =
            document.getElementById("password");

        const confirmPassword =
            document.getElementById("confirmPassword");

        const passwordError =
            document.getElementById("passwordError");

        registerForm.addEventListener(
            "submit",
            function(event) {

                if (password.value !==
                    confirmPassword.value) {

                    event.preventDefault();

                    passwordError.style.display =
                        "block";

                    confirmPassword.focus();

                } else {

                    passwordError.style.display =
                        "none";
                }
            }
        );

        confirmPassword.addEventListener(
            "input",
            function() {

                if (password.value ===
                    confirmPassword.value) {

                    passwordError.style.display =
                        "none";
                }
            }
        );

    </script>

</body>

</html>
