<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transfer Successful - SecureBank</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        .navbar {
            background: #0b1f3a;
            color: white;
            padding: 18px 40px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 15px;
        }

        .message {
            color: #6b7280;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            padding: 13px 25px;
            background: #0b1f3a;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .button:hover {
            background: #16385f;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">SecureBank</div>
    </div>

    <div class="container">

        <div class="card">

            <div class="icon">✅</div>

            <h1>Transfer Successful!</h1>

            <p class="message">
                Money has been transferred successfully.
            </p>

            <a href="/login" class="button">
                Back to Login
            </a>

        </div>

    </div>

</body>

</html>
